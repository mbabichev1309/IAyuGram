name: Probe (vanilla Telegram on xcode-27)

# Feasibility probe: does upstream TelegramMessenger/master build on GitHub's
# xcode-27 preview image at all? Unsigned (fake codesigning), no IAyuGram or
# Swiftgram code. Lives only on the probe/* branches.

on:
  push:
    branches: [ 'probe/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Environment
        run: |
          set -x
          sw_vers
          ls -d /Applications/Xcode*.app
          cat versions.json
          df -h /
          sysctl -n hw.ncpu hw.memsize

      - name: Set active Xcode path
        run: |
          set -x
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          XCODE_APP="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
          # Xcode 26+ ships the Metal toolchain as a separate download and the
          # preview image doesn't have it.
          xcodebuild -downloadComponent MetalToolchain
          xcrun -f metal
          # The image has 37 GB free; every other Xcode is 10+ GB we don't need.
          for x in /Applications/Xcode_*.app; do
            r=$(cd "$x" 2>/dev/null && pwd -P) || continue
            [ "$r" = "$(cd "$XCODE_APP" && pwd -P)" ] || sudo rm -rf "$r" || true
          done
          df -h /

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios
          # The original checkout is a second full copy of the tree.
          find $GITHUB_WORKSPACE -mindepth 1 -delete
          df -h /

      - name: Build the App (unsigned)
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"

          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            set +x
            {
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
              echo "build --remote_timeout=10m"
              echo "build --remote_local_fallback"
            } >> .bazelrc
            set -x
            echo "BuildBuddy remote cache enabled"
          fi

          # 3 CPUs / 7 GB: a previous run lost the runner after 76 min of a cold build.
          {
            echo "build --jobs=2"
            echo "build --local_resources=memory=HOST_RAM*.5"
          } >> .bazelrc

          # Resource trace, so a dead runner still leaves a cause in the log.
          ( while true; do
              echo "[res] $(date -u +%H:%M) disk=$(df -h / | awk 'NR==2{print $4}') $(memory_pressure | grep -i 'free percentage')"
              sleep 60
            done ) &

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          find -L bazel-out -type f -name '*.ipa' -path '*/bin/Telegram/*' ! -path '*.runfiles/*' | head -n 3
