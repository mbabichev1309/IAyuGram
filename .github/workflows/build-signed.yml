name: CI (signed)

# Signed ad-hoc build for on-device install (Method A: friend's paid account).
# Requires these repo secrets:
#   IOS_P12_BASE64      base64 of the signing .p12 (empty password)
#   IOS_PROFILE_BASE64  base64 of the ad-hoc provisioning profile
#   IOS_API_ID          Telegram api_id
#   IOS_API_HASH        Telegram api_hash
# Non-secret build identity is inlined below (team id / bundle id are not secret).

on:
  workflow_dispatch:

env:
  IOS_BUNDLE_ID: org.internalplay.iayugram
  IOS_TEAM_ID: 5D52JNP4T8

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -x
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          XCODE_APP="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the signed App
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_API_ID: ${{ secrets.IOS_API_ID }}
          IOS_API_HASH: ${{ secrets.IOS_API_HASH }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"

          # 1) development configuration (gitignored → generate it here)
          cat > build-system/development_configuration.json <<EOF
          {
            "bundle_id": "${IOS_BUNDLE_ID}",
            "api_id": "${IOS_API_ID}",
            "api_hash": "${IOS_API_HASH}",
            "team_id": "${IOS_TEAM_ID}",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF

          # 2) real codesigning dir (certs/*.p12 imported with empty password;
          #    profiles/Telegram.mobileprovision = main app, extensions disabled)
          rm -rf build-system/real-codesigning
          mkdir -p build-system/real-codesigning/certs build-system/real-codesigning/profiles
          echo "$IOS_P12_BASE64" | base64 --decode > build-system/real-codesigning/certs/dist.p12
          echo "$IOS_PROFILE_BASE64" | base64 --decode > build-system/real-codesigning/profiles/Telegram.mobileprovision

          # 3) import certs (P12_PASSWORD consumed by ImportCertificates.py),
          #    then build signed, extensions disabled (single profile)
          python3 build-system/Make/ImportCertificates.py --path build-system/real-codesigning/certs
          echo "=== signing identities in keychain ==="; security find-identity -v || true
          # BuildBuddy remote cache (shared across ephemeral runners; no 10GB
          # GitHub-cache limit). Appended to .bazelrc so the bazel invoked by
          # Make.py picks it up. Skipped if the secret is absent so the build
          # still works without a cache.
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            set +x
            {
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
              echo "build --remote_timeout=10m"
              echo "build --bes_backend=grpcs://remote.buildbuddy.io"
              echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
            } >> .bazelrc
            set -x
            echo "BuildBuddy remote cache enabled"
          else
            echo "BUILDBUDDY_API_KEY not set — building without remote cache"
          fi

          # --disableExtensions (added to Make.py build) sets the bazel
          # --//Telegram:disableExtensions=True flag so only the main app is
          # built/signed (we have a single provisioning profile).
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/development_configuration.json" \
            --codesigningInformationPath=build-system/real-codesigning \
            --configuration=release_arm64 \
            --disableExtensions \
            --buildNumber="$BUILD_NUMBER"

          # 4) collect the signed ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"; mkdir -p "$OUTPUT_PATH"
          IPA_PATH=$(find -L bazel-out -type f -name '*.ipa' -path '*/bin/Telegram/*' ! -path '*.runfiles/*' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found. All .ipa files:"; find -L bazel-out -name '*.ipa' || true; exit 1
          fi
          echo "Found ipa at: $IPA_PATH"
          cp "$IPA_PATH" "$OUTPUT_PATH/Telegram-signed.ipa"

      - name: Upload signed ipa
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-signed-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error
